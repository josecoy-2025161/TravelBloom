<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="travel_recommendation.css">
    <!-- Enlace a FontAwesome para usar los íconos de redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Contact Us - TravelBloom</title>
</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar">
        <div class="navbar-brand">
            <img src="./images/airplane-logo-img.png" alt="TravelBloom Logo" class="logo-img">
            <h1 class="brand-name">TravelBloom</h1>
        </div>

        <ul class="navbar-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <!-- Página de Contacto -->
    <main class="contact-section">

        <!-- Contenedor para la imagen de fondo -->
        <div class="background-overlay"></div>

        <!-- Barra lateral de Redes Sociales -->
        <aside class="social-sidebar">
            <a href="#" target="_blank"><i class="fa-brands fa-twitter"></i></a>
            <a href="#" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" target="_blank"><i class="fa-brands fa-youtube"></i></a>
        </aside>

        <!-- Contenedor principal dividido en dos columnas -->
        <div class="contact-container">

            <!-- Columna Izquierda: Títulos -->
            <div class="contact-text">
                <h1 class="contact-title">CONTACT US</h1>
                <p class="contact-subtitle">Get in touch</p>
            </div>

            <!-- Columna Derecha: Formulario -->
            <div class="contact-form-container">
                <form action="#" method="POST" class="contact-form">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Enter your message"
                            required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Submit</button>

                </form>
            </div>

        </div>

    </main>

</body>

</html>
